{% extends 'base.html' %}

{% block title %}Register - House Rental Agent{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="stat-icon bg-success text-white mx-auto mb-3">
                            <i class="bi bi-person-plus"></i>
                        </div>
                        <h3 class="fw-bold mb-1">Create an Account</h3>
                        <p class="text-muted small">Join House Rental Agent as an Owner or Tenant</p>
                    </div>

                    <form action="{{ url_for('register') }}" method="POST" id="registerForm">
                        <div class="mb-3">
                            <label for="name" class="form-label fw-semibold">Full Name</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control border-start-0" id="name" name="name" placeholder="e.g. Ramesh Patel" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control border-start-0" id="email" name="email" placeholder="ramesh@example.com" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="phone" class="form-label fw-semibold">Phone Number</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-telephone"></i></span>
                                <input type="tel" class="form-control border-start-0" id="phone" name="phone" placeholder="10-digit mobile number" pattern="[0-9]{10}" title="Please enter a valid 10-digit phone number" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="Create a secure password" minlength="4" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold d-block">Register As</label>
                            <div class="row g-2">
                                <div class="col-6">
                                    <input type="radio" class="btn-check" name="role" id="role-tenant" value="tenant" checked>
                                    <label class="btn btn-outline-success w-100 py-2 d-flex flex-column align-items-center" for="role-tenant">
                                        <i class="bi bi-person fs-4 mb-1"></i>
                                        <span class="fw-bold">Tenant</span>
                                        <small class="text-muted">Looking for a house</small>
                                    </label>
                                </div>
                                <div class="col-6">
                                    <input type="radio" class="btn-check" name="role" id="role-owner" value="owner">
                                    <label class="btn btn-outline-primary w-100 py-2 d-flex flex-column align-items-center" for="role-owner">
                                        <i class="bi bi-building fs-4 mb-1"></i>
                                        <span class="fw-bold">House Owner</span>
                                        <small class="text-muted">Want to list property</small>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-success w-100 py-2 fw-semibold mb-3" id="register-submit-btn">
                            <i class="bi bi-check2-circle me-1"></i> Register Now
                        </button>
                    </form>

                    <div class="text-center pt-3 border-top">
                        <p class="text-muted small mb-0">Already have an account? 
                            <a href="{{ url_for('login') }}" class="text-primary fw-semibold text-decoration-none">Login here</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
