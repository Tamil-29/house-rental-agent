{% extends 'base.html' %}

{% block title %}Login - House Rental Agent{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="stat-icon bg-primary text-white mx-auto mb-3">
                            <i class="bi bi-box-arrow-in-right"></i>
                        </div>
                        <h3 class="fw-bold mb-1">Welcome Back</h3>
                        <p class="text-muted small">Sign in to your House Rental Agent account</p>
                    </div>

                    <!-- Quick Demo Credential Fillers for College Demo/Viva -->
                    <div class="alert alert-light border p-2 mb-4 rounded-3 text-center">
                        <small class="text-muted d-block fw-semibold mb-2">
                            <i class="bi bi-lightbulb-fill text-warning"></i> Quick Demo Accounts (Click to fill):
                        </small>
                        <div class="d-flex justify-content-center gap-1">
                            <button type="button" class="btn btn-outline-danger btn-sm" onclick="fillDemoLogin('admin')" id="demo-admin-btn">
                                Admin
                            </button>
                            <button type="button" class="btn btn-outline-primary btn-sm" onclick="fillDemoLogin('owner')" id="demo-owner-btn">
                                Owner
                            </button>
                            <button type="button" class="btn btn-outline-success btn-sm" onclick="fillDemoLogin('tenant')" id="demo-tenant-btn">
                                Tenant
                            </button>
                        </div>
                    </div>

                    <form action="{{ url_for('login') }}" method="POST" id="loginForm">
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control border-start-0" id="email" name="email" placeholder="name@example.com" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="Enter password" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="role" class="form-label fw-semibold">Login Role</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-shield-lock"></i></span>
                                <select class="form-select border-start-0" id="role" name="role" required>
                                    <option value="">-- Select Your Role --</option>
                                    <option value="tenant">Tenant</option>
                                    <option value="owner">House Owner</option>
                                    <option value="admin">Administrator</option>
                                </select>
                            </div>
                            <div class="form-text">Choose the role matching your registration.</div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3" id="login-submit-btn">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                        </button>
                    </form>

                    <div class="text-center pt-3 border-top">
                        <p class="text-muted small mb-0">Don't have an account? 
                            <a href="{{ url_for('register') }}" class="text-primary fw-semibold text-decoration-none">Register here</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
